{% extends "base.html" %}

{% block title %}Login{% endblock %}

{% block content %}
<section class="section auth-section">
    <div class="container">
        <div class="form-card form-card-narrow">
            <h1>Welcome back</h1>
            <p class="form-subtitle">Log in to add recipes, save favourites and write reviews.</p>

            <form method="post" action="{{ url_for('login') }}" class="form">
                <!-- Hidden field: the page to return to after logging in -->
                <input type="hidden" name="next" value="{{ next_url or '' }}">

                <div class="form-group">
                    <label for="email">Email address</label>
                    <input type="email" id="email" name="email" value="{{ email or '' }}"
                           required autocomplete="email">
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password"
                           required autocomplete="current-password">
                </div>

                <button type="submit" class="btn btn-primary btn-block">Log in</button>
            </form>

            <p class="form-footer">
                New to RecipeShare? <a href="{{ url_for('register') }}">Create an account</a>
            </p>
        </div>
    </div>
</section>
{% endblock %}
