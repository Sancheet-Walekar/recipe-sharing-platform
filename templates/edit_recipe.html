{% extends "base.html" %}

{% block title %}Edit {{ recipe.title }}{% endblock %}

{% block content %}
<section class="page-header">
    <div class="container">
        <h1>Edit recipe</h1>
        <p>Update the details of "{{ recipe.title }}".</p>
    </div>
</section>

<section class="section">
    <div class="container">
        <div class="form-card">
            <form method="post" action="{{ url_for('edit_recipe', recipe_id=recipe.id) }}" class="form">
                {% include "_recipe_form_fields.html" %}

                <div class="form-actions">
                    <button type="submit" class="btn btn-primary">Save changes</button>
                    <a href="{{ url_for('recipe_details', recipe_id=recipe.id) }}" class="btn btn-outline">Cancel</a>
                </div>
            </form>
        </div>
    </div>
</section>
{% endblock %}
