{% extends "base.html" %}

{% block title %}Register{% endblock %}

{% block content %}
<section class="section auth-section">
    <div class="container">
        <div class="form-card form-card-narrow">
            <h1>Create your account</h1>
            <p class="form-subtitle">Join RecipeShare to share and save recipes.</p>

            <!-- "novalidate" is NOT used: the browser checks basic things first,
                 and Flask always checks everything again on the server. -->
            <form method="post" action="{{ url_for('register') }}" class="form">
                <div class="form-group">
                    <label for="name">Full name</label>
                    <input type="text" id="name" name="name" value="{{ name or '' }}"
                           maxlength="60" required autocomplete="name">
                </div>

                <div class="form-group">
                    <label for="email">Email address</label>
                    <input type="email" id="email" name="email" value="{{ email or '' }}"
                           required autocomplete="email">
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password"
                           minlength="6" required autocomplete="new-password">
                    <small class="form-hint">At least 6 characters.</small>
                </div>

                <div class="form-group">
                    <label for="confirm_password">Confirm password</label>
                    <input type="password" id="confirm_password" name="confirm_password"
                           minlength="6" required autocomplete="new-password">
                </div>

                <button type="submit" class="btn btn-primary btn-block">Create account</button>
            </form>

            <p class="form-footer">
                Already have an account? <a href="{{ url_for('login') }}">Log in</a>
            </p>
        </div>
    </div>
</section>
{% endblock %}
