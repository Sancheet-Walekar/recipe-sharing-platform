{% extends "base.html" %}

{% block title %}Page Not Found{% endblock %}

{% block content %}
<section class="section">
    <div class="container error-page">
        <p class="error-code">404</p>
        <h1>Oops! This page is off the menu.</h1>
        <p>The page or recipe you are looking for does not exist or may have been removed.</p>
        <div class="error-actions">
            <a href="{{ url_for('index') }}" class="btn btn-primary">Go to Home</a>
            <a href="{{ url_for('recipes') }}" class="btn btn-outline">Browse Recipes</a>
        </div>
    </div>
</section>
{% endblock %}
